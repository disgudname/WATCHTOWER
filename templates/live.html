<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WATCHTOWER — LIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
      font-family: 'Share Tech Mono', monospace;
      color: #fff;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 60%, transparent 35%, rgba(0,0,0,0.45) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .panel {
      position: absolute;
      background: rgba(6, 8, 14, 0.78);
      border: 1px solid rgba(240, 165, 0, 0.22);
    }

    #wx-icon { width: 52px; height: 52px; filter: brightness(1.1) saturate(0.9); }
    #wx-temp, #wx-desc {
      font-family: 'Share Tech Mono', monospace;
      font-size: 34px; font-weight: 400; letter-spacing: 2px;
      color: #fff; text-transform: uppercase;
    }
    .loc-divider { width: 1px; height: 32px; background: rgba(240,165,0,0.3); }

    #map-wrap {
      bottom: 178px; right: 44px;
      width: 360px; height: 270px;
      overflow: hidden;
    }
    #map { width: 100%; height: 100%; }
    #map .maplibregl-ctrl-top-left,
    #map .maplibregl-ctrl-top-right,
    #map .maplibregl-ctrl-bottom-left,
    #map .maplibregl-ctrl-bottom-right { display: none !important; }

    #loc-bar {
      position: absolute;
      bottom: 72px; left: 0; right: 0; height: 90px;
      background: rgba(6, 8, 14, 0.88);
      border-top: 1px solid rgba(240,165,0,0.18);
      display: flex; align-items: center; justify-content: center; gap: 28px;
      z-index: 10;
    }
    #loc-val { font-size: 36px; letter-spacing: 3px; text-transform: uppercase; }

    #stale-badge {
      bottom: 460px; right: 44px;
      padding: 9px 18px;
      background: rgba(180, 20, 20, 0.88);
      border: 1px solid rgba(220, 60, 60, 0.6);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 17px; font-weight: 600; letter-spacing: 5px;
      color: #fff; text-transform: uppercase;
      display: none;
      animation: stale-pulse 2.4s ease-in-out infinite;
    }
    #stale-badge.show { display: block; }
    @keyframes stale-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.45; }
    }

    #state-banner {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; pointer-events: none;
      opacity: 0; transition: opacity 1s ease; z-index: 20;
    }
    #state-banner.show { opacity: 1; }
    #state-banner-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px; font-weight: 300; letter-spacing: 10px;
      color: #fff; text-transform: uppercase;
    }
    #state-banner-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 120px; font-weight: 800; letter-spacing: 16px;
      color: #fff; text-transform: uppercase; line-height: 1;
      text-shadow: 0 0 80px rgba(240,165,0,0.35);
    }

    #tips-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 72px;
      background: rgba(6, 8, 14, 0.92);
      border-top: 1px solid rgba(240,165,0,0.2);
      display: flex; align-items: center; justify-content: center;
      gap: 28px; padding: 0 44px; z-index: 10;
    }
    #tips-tag {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px; font-weight: 700; letter-spacing: 6px;
      color: #fff; text-transform: uppercase; flex-shrink: 0;
      background: #f0a500;
      display: inline-flex; align-items: center;
      padding: 7px 10px 7px 16px; height: 40px;
    }
    #tips-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 30px; font-weight: 600; font-style: italic;
      letter-spacing: 1px; color: #fff; transition: opacity 0.7s ease;
    }

    #highway-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px; font-weight: 700; letter-spacing: 3px;
      padding: 5px 14px; border-radius: 4px;
      text-transform: uppercase; display: none;
    }
    #highway-badge:not(:empty) { display: inline-block; }
    #highway-badge.hw-interstate { background: #003f87; color: #fff; border: 1px solid rgba(255,255,255,0.35); }
    #highway-badge.hw-us         { background: #f0a500; color: #000; border: 1px solid rgba(0,0,0,0.2); }

    .live-dot {
      width: 22px; height: 22px; border-radius: 50%;
      background: #f0a500; border: 3px solid #fff;
      box-shadow: 0 0 10px rgba(240,165,0,0.9);
    }
  </style>
</head>
<body>

  <div id="state-banner">
    <div id="state-banner-label">Now entering</div>
    <div id="state-banner-name"></div>
  </div>

  <div id="map-wrap" class="panel">
    <div id="map"></div>
  </div>

  <div id="loc-bar">
    <img id="wx-icon" src="https://openweathermap.org/img/wn/01d@2x.png" alt="">
    <span id="wx-temp">---°F</span>
    <div class="loc-divider"></div>
    <span id="highway-badge"></span>
    <span id="loc-val">---</span>
    <div class="loc-divider"></div>
    <span id="wx-desc">---</span>
  </div>

  <div id="stale-badge" class="panel">&#9888; GPS SIGNAL LOST</div>

  <div id="tips-bar">
    <span id="tips-tag">Tip</span>
    <span id="tips-text"></span>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/static/adsb-markers.js"></script>
  <script>
    // ── Layer / source ID constants ────────────────────────────────────────
    const RADAR_SRC_PFX = 'eoc-weather-radar-source-';
    const RADAR_LYR_PFX = 'eoc-weather-radar-frame-';
    const WX_SRC        = 'eoc-weather-alerts';
    const WX_FILL       = 'eoc-weather-alerts-fill';
    const WX_HALO       = 'eoc-weather-alerts-halo';
    const WX_LINE       = 'eoc-weather-alerts-line';
    const WX_FLASH      = 'eoc-weather-alerts-flash';
    const TFR_SRC       = 'eoc-aviation-tfr';
    const TFR_FILL      = 'eoc-aviation-tfr-fill';
    const TFR_HALO      = 'eoc-aviation-tfr-outline-halo';
    const TFR_LINE      = 'eoc-aviation-tfr-outline';
    const ROUTE_SRC     = 'wt-route';
    const ROUTE_LYR     = 'wt-route-line';
    const ADSB_SRC      = 'eoc-adsb-aircraft';
    const ADSB_LYR       = 'eoc-adsb-aircraft-layer';
    const WX_MARCH       = 'eoc-weather-alerts-emergency-march';
    const WX_MOTION_SRC  = 'eoc-weather-motion';
    const WX_MOTION_PATH = 'eoc-weather-motion-path';
    const WX_MOTION_PT   = 'eoc-weather-motion-point';
    const WX_MARCH_FRAMES = [
      [4, 3], [0, 0.5, 4, 2.5], [0, 1, 4, 2], [0, 1.5, 4, 1.5],
      [0, 2, 4, 1], [0, 2.5, 4, 0.5], [0, 3, 4], [0.5, 3, 3.5],
      [1, 3, 3], [1.5, 3, 2.5], [2, 3, 2], [2.5, 3, 1.5],
      [3, 3, 1], [3.5, 3, 0.5],
    ];
    const MOTION_FORECAST_MIN = 30;

    // ── OpenFreeMap Liberty dark-theme basemap ────────────────────────────
    const MAP_STYLE_CONFIG = {
      styleUrl:             'https://tiles.openfreemap.org/styles/liberty',
      textColor:            '#ffffff',
      mutedText:            '#cbd8e8',
      haloColor:            '#334052',
      roadMinor:            '#2c3036',
      roadMajor:            '#2c3036',
      roadCasing:           '#494e58',
      highwayColor:         '#5a7299',
      roadRail:             '#3c4561',
      landColor:            '#424d5c',
      parkColor:            '#283a32',
      waterColor:           '#5f7481',
      buildingColor:        '#38414e',
      boundaryColor:        '#a3a0ab',
      backgroundColor:      '#424d5c',
      buildingOutlineColor: 'rgba(22,27,33,0.55)',
      surfaceOutlineColor:  'rgba(255,255,255,0.05)',
    };
    function _bmClone(v) { return JSON.parse(JSON.stringify(v)); }
    function _bmDarken(style) {
      const s = _bmClone(style);
      s.name = 'Watchtower Dark';
      const LSIZES = {
        'label_city':         ['interpolate', ['exponential', 1.2], ['zoom'], 4, 13, 7, 15, 11, 20],
        'label_city_capital': ['interpolate', ['exponential', 1.2], ['zoom'], 4, 14, 7, 16, 11, 22],
        'label_town':         ['interpolate', ['exponential', 1.2], ['zoom'], 7, 14, 11, 16],
        'label_village':      ['interpolate', ['exponential', 1.2], ['zoom'], 7, 12, 11, 14],
        'label_state':        ['interpolate', ['linear'], ['zoom'], 5, 12, 8, 16],
        'label_country_1':    ['interpolate', ['linear'], ['zoom'], 1, 11, 4, 19],
        'label_country_2':    ['interpolate', ['linear'], ['zoom'], 2, 11, 5, 19],
        'label_country_3':    ['interpolate', ['linear'], ['zoom'], 3, 11, 7, 19],
      };
      s.layers = (s.layers || []).map(layer => {
        const l = _bmClone(layer);
        const id = String(l.id || '').toLowerCase();
        const type = String(l.type || '').toLowerCase();
        const paint = l.paint || {};
        const layout = l.layout || {};
        if (LSIZES[id] != null) layout['text-size'] = LSIZES[id];
        if (type === 'background') paint['background-color'] = MAP_STYLE_CONFIG.backgroundColor;
        if (type === 'fill') {
          if (id.includes('water')) paint['fill-color'] = MAP_STYLE_CONFIG.waterColor;
          else if (/(park|forest|wood|grass|golf|pitch|cemetery|green)/.test(id)) {
            paint['fill-color'] = MAP_STYLE_CONFIG.parkColor;
            paint['fill-opacity'] = ['interpolate', ['linear'], ['zoom'], 0, 0.22, 7, 0.3, 12, 0.36];
          } else if (/(building|house)/.test(id)) paint['fill-color'] = MAP_STYLE_CONFIG.buildingColor;
          else if (/(landuse|landcover|residential|industrial|commercial|aeroway)/.test(id)) paint['fill-color'] = MAP_STYLE_CONFIG.landColor;
        }
        if (type === 'fill-extrusion' && /(building|house)/.test(id)) {
          paint['fill-extrusion-color'] = MAP_STYLE_CONFIG.buildingColor;
          if (paint['fill-extrusion-base'] == null) paint['fill-extrusion-base'] = 0;
        }
        if (type === 'line') {
          const isCasing = id.includes('casing') || id.includes('outline');
          if (isCasing && MAP_STYLE_CONFIG.roadCasing) paint['line-color'] = MAP_STYLE_CONFIG.roadCasing;
          else if (/(motorway|trunk|primary|major|highway)/.test(id)) paint['line-color'] = MAP_STYLE_CONFIG.roadMajor;
          else if (/(rail|transit)/.test(id)) paint['line-color'] = MAP_STYLE_CONFIG.roadRail;
          else if (/(water|river|stream)/.test(id)) paint['line-color'] = MAP_STYLE_CONFIG.waterColor;
          else if (/(boundary|border)/.test(id)) paint['line-color'] = MAP_STYLE_CONFIG.boundaryColor;
          else if (/(road|street|transport)/.test(id)) paint['line-color'] = MAP_STYLE_CONFIG.roadMinor;
          const srcLayer = String(l['source-layer'] || '').toLowerCase();
          if (id.includes('park_outline') || srcLayer === 'park') layout.visibility = 'none';
        }
        if (type === 'symbol') {
          if (paint['text-color'] != null) paint['text-color'] = /(poi|housenumber|address|minor)/.test(id) ? MAP_STYLE_CONFIG.mutedText : MAP_STYLE_CONFIG.textColor;
          if (paint['text-halo-color'] != null) paint['text-halo-color'] = MAP_STYLE_CONFIG.haloColor;
          if (paint['icon-color'] != null) paint['icon-color'] = MAP_STYLE_CONFIG.mutedText;
          if (/(poi|business|shop)/.test(id) && layout['text-size'] == null) layout['text-size'] = 11;
        }
        if (paint['fill-outline-color'] != null && /(building|landuse|park|water)/.test(id))
          paint['fill-outline-color'] = /(building|house)/.test(id) ? MAP_STYLE_CONFIG.buildingOutlineColor : MAP_STYLE_CONFIG.surfaceOutlineColor;
        if (paint['fill-extrusion-outline-color'] != null && /(building|house)/.test(id))
          paint['fill-extrusion-outline-color'] = MAP_STYLE_CONFIG.buildingOutlineColor;
        l.paint = paint; l.layout = layout;
        return l;
      });
      return s;
    }
    function _bmRasterTuning(style) {
      style.layers = (style.layers || []).map(layer => {
        const l = _bmClone(layer);
        if (String(l.type || '').toLowerCase() !== 'raster') return l;
        const paint = l.paint || {};
        paint['raster-saturation'] = -0.9; paint['raster-contrast'] = 0.18;
        paint['raster-brightness-min'] = 0.04; paint['raster-brightness-max'] = 0.34;
        if (String(l.id || '').toLowerCase().includes('natural_earth'))
          paint['raster-opacity'] = ['interpolate', ['exponential', 1.5], ['zoom'], 0, 0.26, 6, 0.04];
        l.paint = paint; return l;
      });
    }
    function _bmHighwayColor(style) {
      const hc = String(MAP_STYLE_CONFIG.highwayColor || '').trim();
      if (!hc) return;
      style.layers = (style.layers || []).map(layer => {
        const l = _bmClone(layer);
        const id = String(l.id || '').toLowerCase();
        if (String(l.type || '').toLowerCase() !== 'line') return l;
        if (String(l['source-layer'] || '').toLowerCase() !== 'transportation') return l;
        const paint = l.paint || {};
        if (paint['line-color'] == null || id.includes('casing') || id.includes('outline')) return l;
        const orig = paint['line-color'];
        paint['line-color'] = ['match', ['get', 'class'],
          'motorway', hc, 'motorway_link', hc, 'trunk', hc, 'trunk_link', hc,
          'primary', hc, 'primary_link', hc, orig];
        l.paint = paint; return l;
      });
    }
    function _bmSmallRoads(style) {
      style.layers = (style.layers || []).map(layer => {
        const l = _bmClone(layer);
        if (String(l.type || '').toLowerCase() !== 'line') return l;
        if (String(l['source-layer'] || '').toLowerCase() !== 'transportation') return l;
        const paint = l.paint || {};
        if (paint['line-color'] == null && paint['line-width'] == null) return l;
        const id = String(l.id || '').toLowerCase();
        const isCasing = id.includes('casing');
        function hasClass(cs) {
          const lcs = cs.map(c => String(c).toLowerCase());
          if (lcs.some(c => id.includes(c))) return true;
          const ft = JSON.stringify(l.filter || '').toLowerCase();
          return lcs.some(c => ft.includes(`"${c}"`));
        }
        const isST = hasClass(['secondary', 'secondary_link', 'tertiary', 'tertiary_link']);
        const isMinor = hasClass(['minor', 'residential', 'living_street', 'unclassified']) || id.includes('road_minor');
        if (!isST && !isMinor) return l;
        if (isST) {
          if (typeof l.minzoom === 'number' && l.minzoom > 8) l.minzoom = 8;
          paint['line-width'] = ['interpolate', ['exponential', 1.18], ['zoom'],
            7.8, 0, 8.6, isCasing ? 0.34 : 0.24, 10, isCasing ? 0.82 : 0.58,
            12, isCasing ? 1.4 : 1.06, 20, isCasing ? 14 : 13];
          if (paint['line-opacity'] != null)
            paint['line-opacity'] = ['interpolate', ['linear'], ['zoom'], 7.8, 0.3, 10, 0.74, 12, 0.9, 14, 1];
        }
        if (isMinor) {
          if (typeof l.minzoom === 'number' && l.minzoom > 11) l.minzoom = 11;
          paint['line-width'] = ['interpolate', ['exponential', 1.18], ['zoom'],
            10.6, 0, 11.2, isCasing ? 0.24 : 0.16, 12.2, isCasing ? 0.42 : 0.3,
            14, isCasing ? 2.8 : 2.5, 20, isCasing ? 19 : 18];
          if (paint['line-opacity'] != null)
            paint['line-opacity'] = ['interpolate', ['linear'], ['zoom'], 10.6, 0.32, 12.2, 0.62, 14, 0.92, 16, 1];
        }
        l.paint = paint; return l;
      });
    }
    function _bmBoundaries(style) {
      if (!style || !style.sources || !style.sources.openmaptiles) return;
      const bc = String(MAP_STYLE_CONFIG.boundaryColor || '#a3a0ab').trim();
      const layers = (style.layers || [])
        .filter(l => { const id = String(l && l.id ? l.id : ''); return id !== 'paeoc-boundary-state' && id !== 'paeoc-boundary-county'; })
        .map(layer => {
          const l = _bmClone(layer); const id = String(l && l.id ? l.id : '');
          if (id === 'boundary_2' || id === 'boundary_3' || id === 'boundary_disputed')
            (l.layout = l.layout || {}).visibility = 'none';
          return l;
        });
      const idx = layers.findIndex(l => { const id = String(l && l.id ? l.id : ''); return id.startsWith('boundary_') || id === 'boundary_disputed'; });
      const at = idx >= 0 ? idx : layers.length;
      const stateLayer = {
        id: 'paeoc-boundary-state', type: 'line', source: 'openmaptiles', 'source-layer': 'boundary', minzoom: 0,
        filter: ['all', ['==', ['get', 'admin_level'], 4], ['!=', ['get', 'maritime'], 1], ['!=', ['get', 'disputed'], 1], ['!', ['has', 'claimed_by']]],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': bc, 'line-opacity': 0.9, 'line-width': ['interpolate', ['linear'], ['zoom'], 0, 0.55, 3, 0.68, 6, 0.82, 10, 1.02, 14, 1.28, 18, 1.62] },
      };
      const countyLayer = {
        id: 'paeoc-boundary-county', type: 'line', source: 'openmaptiles', 'source-layer': 'boundary', minzoom: 0,
        filter: ['all', ['any', ['==', ['get', 'admin_level'], 2], ['==', ['get', 'admin_level'], 3], ['==', ['get', 'admin_level'], 4], ['==', ['get', 'admin_level'], 5], ['==', ['get', 'admin_level'], 6]], ['!=', ['get', 'maritime'], 1], ['!=', ['get', 'disputed'], 1], ['!', ['has', 'claimed_by']]],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': bc, 'line-opacity': 0.82, 'line-width': ['interpolate', ['linear'], ['zoom'], 0, 0.42, 3, 0.52, 6, 0.64, 10, 0.8, 14, 0.98, 18, 1.26] },
      };
      layers.splice(at, 0, countyLayer, stateLayer);
      style.layers = layers;
    }
    async function resolveBasemapStyle() {
      const res = await fetch(MAP_STYLE_CONFIG.styleUrl);
      if (!res.ok) throw new Error(`Basemap fetch failed (${res.status})`);
      const raw = await res.json();
      const style = _bmDarken(raw);
      _bmRasterTuning(style); _bmHighwayColor(style); _bmSmallRoads(style); _bmBoundaries(style);
      return style;
    }

    // ── Map ───────────────────────────────────────────────────────────────
    let map, posMarker;
    let wxHasFlash = false, wxHasMarch = false;

    // ── Shared state ──────────────────────────────────────────────────────
    let lastLat = null, lastLon = null, lastCrossingAt = null;
    let adsbLat = null, adsbLon = null, adsbReady = false;
    let fullRoute = [], liveCoords = [], lastPt = null;

    resolveBasemapStyle().then(style => {
      map = new maplibregl.Map({
        container: 'map',
        style,
        center: [-98.35, 39.5],
        zoom: 11,
        interactive: false,
        attributionControl: false,
      });

      const liveDotEl = document.createElement('div');
      liveDotEl.className = 'live-dot';
      posMarker = new maplibregl.Marker({ element: liveDotEl, anchor: 'center' })
        .setLngLat([-98.35, 39.5])
        .addTo(map);

      // ── Map load: wire up all sources and layers ──────────────────────────
      map.on('load', () => {

      // Sources
      map.addSource(WX_SRC,    { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addSource(TFR_SRC,   { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addSource(ROUTE_SRC, { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } } });
      map.addSource(ADSB_SRC,      { type: 'geojson', data: { type: 'FeatureCollection', features: [] }, promoteId: 'hex' });
      map.addSource(WX_MOTION_SRC, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

      // Radar frames are added dynamically inside initRadar(), always
      // inserted before WX_FILL so they sit under alert polygons.

      // ── Weather alert layers ──
      map.addLayer({
        id: WX_FILL, type: 'fill', source: WX_SRC,
        layout: { 'fill-sort-key': ['coalesce', ['get', '_wxSortKey'], 0] },
        paint: {
          'fill-color':   ['coalesce', ['get', '_fill'], '#60a5fa'],
          'fill-opacity': ['coalesce', ['get', '_fillOp'], 0.12],
        },
      });
      map.addLayer({
        id: WX_HALO, type: 'line', source: WX_SRC,
        layout: { 'line-cap': 'round', 'line-join': 'round', 'line-sort-key': ['coalesce', ['get', '_wxSortKey'], 0] },
        paint: {
          'line-color': ['coalesce', ['get', '_halo'], '#ffffff'],
          'line-width': ['interpolate', ['linear'], ['zoom'],
            5, ['*', ['coalesce', ['get', '_haloW'], 2.75], 0.5],
            12, ['coalesce', ['get', '_haloW'], 2.75]],
          'line-opacity': 0.92,
        },
      });
      map.addLayer({
        id: WX_LINE, type: 'line', source: WX_SRC,
        layout: { 'line-cap': 'round', 'line-join': 'round', 'line-sort-key': ['coalesce', ['get', '_wxSortKey'], 0] },
        paint: {
          'line-color': ['coalesce', ['get', '_line'], '#60a5fa'],
          'line-width': ['interpolate', ['linear'], ['zoom'],
            5, ['*', ['coalesce', ['get', '_lineW'], 1.25], 0.5],
            12, ['coalesce', ['get', '_lineW'], 1.25]],
          'line-opacity': 0.95,
        },
      });
      // Flash layer pulses white for tornado/severe thunderstorm warnings
      map.addLayer({
        id: WX_FLASH, type: 'line', source: WX_SRC,
        filter: ['==', ['coalesce', ['get', '_wxFlashBorder'], 0], 1],
        layout: { 'line-cap': 'round', 'line-join': 'round', 'line-sort-key': ['coalesce', ['get', '_wxSortKey'], 0] },
        paint: {
          'line-color': '#ffffff',
          'line-width': ['interpolate', ['linear'], ['zoom'],
            5, ['*', ['coalesce', ['get', '_lineW'], 2.1], 0.5],
            12, ['coalesce', ['get', '_lineW'], 2.1]],
          'line-opacity': 0,
        },
      });
      // Marching-ants for PDS/EMERGENCY/OBSERVED tornado+severe warnings
      map.addLayer({
        id: WX_MARCH, type: 'line', source: WX_SRC,
        filter: ['all',
          ['any',
            ['all',
              ['any',
                ['==', ['get', '_wxEvent'], 'TORNADO WARNING'],
                ['==', ['get', '_wxEvent'], 'FLASH FLOOD WARNING'],
                ['==', ['get', '_wxEvent'], 'SEVERE THUNDERSTORM WARNING'],
              ],
              ['any',
                ['==', ['get', '_wxIntensity'], 'EMERGENCY'],
                ['==', ['get', '_wxIntensity'], 'PDS'],
              ],
            ],
            ['all',
              ['==', ['get', '_wxEvent'], 'TORNADO WARNING'],
              ['==', ['get', '_wxIntensity'], 'OBSERVED'],
            ],
          ],
        ],
        layout: { 'line-cap': 'butt', 'line-join': 'round', 'line-sort-key': ['coalesce', ['get', '_wxSortKey'], 0] },
        paint: {
          'line-color': ['coalesce', ['get', '_line'], '#ab47bc'],
          'line-width': ['interpolate', ['linear'], ['zoom'],
            5, ['*', ['coalesce', ['get', '_lineW'], 2.5], 0.75],
            12, ['*', ['coalesce', ['get', '_lineW'], 2.5], 1.5]],
          'line-opacity': 1,
          'line-dasharray': WX_MARCH_FRAMES[0],
        },
      });
      // Storm motion vectors
      map.addLayer({
        id: WX_MOTION_PATH, type: 'line', source: WX_MOTION_SRC,
        minzoom: 6,
        filter: ['==', ['get', '_role'], 'path'],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': ['coalesce', ['get', '_color'], '#ff0000'],
          'line-width': ['interpolate', ['linear'], ['zoom'], 6, 1.2, 12, 2.2],
          'line-opacity': 0.85,
          'line-dasharray': [2, 2],
        },
      });
      map.addLayer({
        id: WX_MOTION_PT, type: 'circle', source: WX_MOTION_SRC,
        minzoom: 6,
        filter: ['==', ['get', '_role'], 'point'],
        paint: {
          'circle-color': ['coalesce', ['get', '_color'], '#ff0000'],
          'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 3, 12, 6],
          'circle-stroke-color': '#ffffff',
          'circle-stroke-width': 1.5,
          'circle-opacity': 0.95,
        },
      });

      // ── TFR layers ──
      map.addLayer({
        id: TFR_FILL, type: 'fill', source: TFR_SRC,
        paint: {
          'fill-color':   ['coalesce', ['get', 'color'], '#dc2626'],
          'fill-opacity': 0.18,
        },
      });
      map.addLayer({
        id: TFR_HALO, type: 'line', source: TFR_SRC,
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#ffffff', 'line-width': 4.5, 'line-opacity': 0.7 },
      });
      map.addLayer({
        id: TFR_LINE, type: 'line', source: TFR_SRC,
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color':   ['coalesce', ['get', 'color'], '#dc2626'],
          'line-width':   2.2,
          'line-opacity': 1,
        },
      });

      // ── Route ──
      map.addLayer({
        id: ROUTE_LYR, type: 'line', source: ROUTE_SRC,
        paint: { 'line-color': '#f0a500', 'line-width': 2, 'line-opacity': 0.75 },
      });

      // ── ADS-B symbols (topmost overlay layer) ──
      map.addLayer({
        id: ADSB_LYR, type: 'symbol', source: ADSB_SRC,
        layout: {
          'icon-image':                ['get', 'icon'],
          'icon-size':                 ['get', 'scale'],
          'icon-rotate':               ['get', 'track'],
          'icon-rotation-alignment':   'map',
          'icon-pitch-alignment':      'map',
          'icon-allow-overlap':        true,
          'icon-ignore-placement':     true,
          'symbol-sort-key':           ['get', 'sort_key'],
        },
      });

      // ── Start fetching ──
      initRadar();
      refreshWeatherAlerts();
      refreshTfr();
      // ADS-B starts after first GPS fix (see render())

      setInterval(initRadar,           300000);
      setInterval(refreshWeatherAlerts, 120000);
      setInterval(refreshTfr,          300000);
      setInterval(refreshAdsb,          15000);

      // Flash timer — only fires setPaintProperty when there are flash-eligible warnings
      let wxFlashOn = false;
      setInterval(() => {
        if (!wxHasFlash) {
          if (wxFlashOn) { wxFlashOn = false; try { map.setPaintProperty(WX_FLASH, 'line-opacity', 0); } catch {} }
          return;
        }
        wxFlashOn = !wxFlashOn;
        try { map.setPaintProperty(WX_FLASH, 'line-opacity', wxFlashOn ? 0.92 : 0); } catch {}
      }, 800);

      // Marching-ants timer — only runs when there are PDS/EMERGENCY/OBSERVED features
      let wxMarchIdx = 0;
      setInterval(() => {
        if (!wxHasMarch) return;
        wxMarchIdx = (wxMarchIdx + 1) % WX_MARCH_FRAMES.length;
        try { map.setPaintProperty(WX_MARCH, 'line-dasharray', WX_MARCH_FRAMES[wxMarchIdx]); } catch {}
      }, 50);

      loadRoute();
    });
    }).catch(e => console.error('[basemap]', e));

    // ── RADAR ─────────────────────────────────────────────────────────────
    let radarFrames   = [];
    let radarKnownIds = new Set();
    let radarFrameIdx = 0;
    let radarTimer    = null;
    const RADAR_OPACITY = 0.55;

    async function initRadar() {
      try {
        const res = await fetch('/proxy/weather-radar');
        const d   = await res.json();
        if (!d.ok || !Array.isArray(d.frames) || !d.frames.length) return;

        const newIds   = new Set(d.frames.map(f => String(f.id)));
        const tileSize = Math.max(256, d.tile_size || 256);

        // Remove frames that have rolled off the server
        for (const id of radarKnownIds) {
          if (!newIds.has(id)) {
            const lid = RADAR_LYR_PFX + id, sid = RADAR_SRC_PFX + id;
            try { if (map.getLayer(lid)) map.removeLayer(lid); } catch {}
            try { if (map.getSource(sid)) map.removeSource(sid); } catch {}
          }
        }

        // Add any frames not yet on the map, inserting before alert fills
        for (const frame of d.frames) {
          const sid = RADAR_SRC_PFX + frame.id, lid = RADAR_LYR_PFX + frame.id;
          if (!map.getSource(sid))
            map.addSource(sid, { type: 'raster', tiles: [frame.tile_url], tileSize });
          if (!map.getLayer(lid))
            map.addLayer({
              id: lid, type: 'raster', source: sid,
              paint: { 'raster-opacity': 0, 'raster-fade-duration': 0, 'raster-resampling': 'linear' },
            }, WX_FILL);
        }

        radarKnownIds = newIds;
        radarFrames   = d.frames;

        if (!radarTimer) {
          radarFrameIdx = 0;
          radarTimer = setInterval(stepRadarFrame, Math.max(200, d.frame_interval_ms || 300));
        }
      } catch (e) {
        console.warn('[radar]', e);
      }
    }

    function stepRadarFrame() {
      if (!radarFrames.length) return;
      const prev = radarFrames[radarFrameIdx % radarFrames.length];
      try { if (map.getLayer(RADAR_LYR_PFX + prev.id)) map.setPaintProperty(RADAR_LYR_PFX + prev.id, 'raster-opacity', 0); } catch {}
      radarFrameIdx = (radarFrameIdx + 1) % radarFrames.length;
      const cur = radarFrames[radarFrameIdx];
      try { if (map.getLayer(RADAR_LYR_PFX + cur.id)) map.setPaintProperty(RADAR_LYR_PFX + cur.id, 'raster-opacity', RADAR_OPACITY); } catch {}
    }

    // ── WEATHER ALERTS ────────────────────────────────────────────────────
    function wxShouldFlash(f) {
      const event = String(f.properties.event || '').toUpperCase();
      const tier  = String(f.properties.intensity || '').toUpperCase();
      if (['TORNADO WARNING', 'FLASH FLOOD WARNING', 'SEVERE THUNDERSTORM WARNING'].includes(event)
          && (tier === 'EMERGENCY' || tier === 'PDS')) return false;
      if (event === 'TORNADO WARNING' && tier === 'OBSERVED') return false;
      return event === 'TORNADO WARNING' || event === 'SEVERE THUNDERSTORM WARNING';
    }

    function buildMotionFC(features) {
      const mf = [];
      for (const f of features) {
        const p = f.properties || {};
        const m = p.motion;
        if (!m || m.lat == null || m.lon == null) continue;
        const lat = Number(m.lat), lon = Number(m.lon);
        const dir = Number(m.direction_deg), spd = Number(m.speed_kt);
        if (!isFinite(lat) || !isFinite(lon) || !isFinite(dir) || !isFinite(spd)) continue;
        const color = p._line || p._fill || '#ff0000';
        const distNm = Math.max(0, spd) * (MOTION_FORECAST_MIN / 60);
        const bearing = dir * Math.PI / 180;
        const dLat = (distNm / 60) * Math.cos(bearing);
        const cosLat = Math.cos(lat * Math.PI / 180);
        const dLon = Math.abs(cosLat) > 1e-6 ? (distNm / 60) * Math.sin(bearing) / cosLat : 0;
        mf.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: [[lon, lat], [lon + dLon, lat + dLat]] }, properties: { _role: 'path', _color: color } });
        mf.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [lon, lat] }, properties: { _role: 'point', _color: color } });
      }
      return { type: 'FeatureCollection', features: mf };
    }

    async function refreshWeatherAlerts() {
      try {
        const res = await fetch('/proxy/weather-alerts');
        const d   = await res.json();
        if (!d.ok) return;

        const features = (d.features || []).map(f => {
          const s = (f.properties && f.properties.style) || {};
          return {
            ...f,
            properties: {
              ...f.properties,
              _fill:          s.fillColor || s.color || '#60a5fa',
              _fillOp:        s.fillOpacity    ?? 0.12,
              _line:          s.outlineColor   || s.color || '#60a5fa',
              _lineW:         s.outlineWeight  ?? s.weight ?? 1.25,
              _halo:          s.outlineHaloColor || '#ffffff',
              _haloW:         s.outlineHaloWeight ?? s.outlineWeight ?? 2.75,
              _wxSortKey:     -(f.properties.priority || 0),
              _wxEvent:       String(f.properties.event || '').toUpperCase(),
              _wxIntensity:   String(f.properties.intensity || '').toUpperCase(),
              _wxFlashBorder: wxShouldFlash(f) ? 1 : 0,
            },
          };
        });

        const src = map.getSource(WX_SRC);
        if (src) src.setData({ type: 'FeatureCollection', features });
        const motionSrc = map.getSource(WX_MOTION_SRC);
        if (motionSrc) motionSrc.setData(buildMotionFC(features));

        wxHasFlash = features.some(f => f.properties._wxFlashBorder === 1);
        wxHasMarch = features.some(f => {
          const e = f.properties._wxEvent, i = f.properties._wxIntensity;
          return (['TORNADO WARNING', 'FLASH FLOOD WARNING', 'SEVERE THUNDERSTORM WARNING'].includes(e) && ['EMERGENCY', 'PDS'].includes(i)) ||
                 (e === 'TORNADO WARNING' && i === 'OBSERVED');
        });
      } catch (e) {
        console.warn('[wx-alerts]', e);
      }
    }

    // ── TFRs ──────────────────────────────────────────────────────────────
    async function refreshTfr() {
      try {
        const res = await fetch('/proxy/aviation');
        const d   = await res.json();
        if (!d.ok || !d.geojson) return;
        const src = map.getSource(TFR_SRC);
        if (src) src.setData(d.geojson);
      } catch (e) {
        console.warn('[tfr]', e);
      }
    }

    // ── ADS-B ─────────────────────────────────────────────────────────────
    const T90             = window.Tar1090Markers || null;
    const ICON_BASE_SCALE = 1.2;
    const ICON_PX_RATIO   = 2;
    const FALLBACK_SHAPE  = {
      w: 22, h: 22, viewBox: '-2.5 -2.5 22 22',
      path: 'M 4.256,15.496 C 3.979,14.340 7.280,13.606 7.280,13.606 V 8.650 l -6,2 c -0.680,0 -1,-0.350 -1,-0.660 C 0.242,9.595 0.496,9.231 0.880,9.130 1.140,9 4.800,7 7.280,5.630 V 3 C 7.280,1.890 7.720,0.290 8.510,0.290 9.300,0.290 9.770,1.840 9.770,3 v 2.630 c 2.450,1.370 6.100,3.370 6.370,3.500 0.390,0.093 0.651,0.461 0.610,0.860 -0.050,0.310 -0.360,0.670 -1.050,0.670 l -5.930,-2 v 4.946 c 0,0 3.300,0.734 3.024,1.890 -0.331,1.384 -2.830,0.378 -4.254,0.378 -1.434,4.520e-4 -3.950,1.016 -4.284,-0.378 z',
    };

    const _adsbIcons    = new Set();
    let _iconRepushTimer = null;
    const aircraftData  = {};

    // ── Dead reckoning (direct port of EOC adsb-overlay.js) ──────────────
    const ANIM_ERR_BLEND_MS = 2000;
    const ANIM_EXTRAP_MAX_S = 30;
    const ANIM_ERR_SNAP_DEG = 0.02;
    const animStates = {};

    function _advancePosition(lat, lon, gsKt, trackDeg, dtS) {
      const distDeg = (gsKt * dtS) / 3600 / 60;
      const th = trackDeg * Math.PI / 180;
      const cosLat = Math.cos(lat * Math.PI / 180);
      return [
        lat + distDeg * Math.cos(th),
        lon + distDeg * Math.sin(th) / (Math.abs(cosLat) > 1e-6 ? cosLat : 1e-6),
      ];
    }

    function _displayedCoords(hex, ac, nowMs) {
      const st = animStates[hex];
      if (!st) return [ac.lat, ac.lon];
      let lat = st.refLat, lon = st.refLon;
      if (st.gs > 1 && st.track != null) {
        const dtS = Math.min(Math.max((nowMs - st.refTime) / 1000, 0), ANIM_EXTRAP_MAX_S);
        const adv = _advancePosition(lat, lon, st.gs, st.track, dtS);
        lat = adv[0]; lon = adv[1];
      }
      const f = 1 - (nowMs - st.errTime) / ANIM_ERR_BLEND_MS;
      if (f > 0) { lat += st.errLat * f; lon += st.errLon * f; }
      if (st.dispLat != null && st.gs > 1 && st.track != null) {
        const th = st.track * Math.PI / 180;
        const cosLat = Math.cos(lat * Math.PI / 180);
        const cl = Math.abs(cosLat) > 1e-6 ? cosLat : 1e-6;
        const along = (lat - st.dispLat) * Math.cos(th) + (lon - st.dispLon) * cl * Math.sin(th);
        if (along < 0 && along > -ANIM_ERR_SNAP_DEG) {
          lat -= along * Math.cos(th);
          lon -= along * Math.sin(th) / cl;
        }
      }
      st.dispLat = lat; st.dispLon = lon;
      return [lat, lon];
    }

    function _updateAnimState(hex, ac, nowMs) {
      const seenPos = typeof ac.seen_pos === 'number' ? ac.seen_pos : 0;
      const refTime = nowMs - seenPos * 1000;
      const gs    = (typeof ac.gs === 'number' && isFinite(ac.gs)) ? ac.gs : 0;
      const track = (typeof ac.track === 'number' && !isNaN(ac.track)) ? ac.track : null;
      const prev  = animStates[hex];
      let errLat = 0, errLon = 0;
      if (prev && prev.dispLat != null) {
        let pLat = ac.lat, pLon = ac.lon;
        if (gs > 1 && track != null) {
          const dtS = Math.min(Math.max((nowMs - refTime) / 1000, 0), ANIM_EXTRAP_MAX_S);
          const adv = _advancePosition(pLat, pLon, gs, track, dtS);
          pLat = adv[0]; pLon = adv[1];
        }
        errLat = prev.dispLat - pLat;
        errLon = prev.dispLon - pLon;
        if (Math.abs(errLat) > ANIM_ERR_SNAP_DEG || Math.abs(errLon) > ANIM_ERR_SNAP_DEG) {
          errLat = 0; errLon = 0;
        }
      }
      animStates[hex] = {
        refLat: ac.lat, refLon: ac.lon, refTime, gs, track,
        errLat, errLon, errTime: nowMs,
        dispLat: prev ? prev.dispLat : null,
        dispLon: prev ? prev.dispLon : null,
      };
    }

    function _animHasMotion(nowMs) {
      for (const hex of Object.keys(animStates)) {
        const st = animStates[hex];
        if ((st.errLat || st.errLon) && nowMs - st.errTime < ANIM_ERR_BLEND_MS) return true;
        if (st.gs > 1 && st.track != null && (nowMs - st.refTime) / 1000 < ANIM_EXTRAP_MAX_S) return true;
      }
      return false;
    }

    function _animFrameMs() {
      let z = 10;
      try { z = map.getZoom(); } catch (_) {}
      return z >= 11 ? 100 : z >= 8 ? 250 : 600;
    }

    let _animRaf = null;
    let _animLastPush = 0;
    function _animTick() {
      _animRaf = null;
      if (!Object.keys(animStates).length) return;
      const now = Date.now();
      if (!_animHasMotion(now)) return;
      if (now - _animLastPush >= _animFrameMs()) {
        _animLastPush = now;
        pushAircraft();
      }
      _animRaf = requestAnimationFrame(_animTick);
    }
    function startAnimLoop() {
      if (_animRaf == null) _animRaf = requestAnimationFrame(_animTick);
    }

    function altHsl(alt) {
      if (!T90) return [0, 0, 53];
      let a = (alt === 0 || alt === 'ground') ? 'ground'
            : (typeof alt === 'number' ? alt : (() => { const p = parseInt(alt, 10); return isNaN(p) ? null : p; })());
      const hsl = T90.altitudeColor(a);
      if (a === 'ground') hsl[2] += 15;
      return hsl;
    }

    function iconId(shape, hsl) {
      return `adsb-${shape}-${Math.round(hsl[0]*10)/10}-${hsl[1]}-${Math.round(hsl[2]*10)/10}`;
    }

    function baseMarker(ac) {
      if (!T90) return { shape: 'unknown', scale: 1 };
      const alt = ac.alt_baro === 0 ? 'ground' : ac.alt_baro;
      const bm  = T90.getBaseMarker(ac.category || null, ac.t || null, null, null, ac.type || null, alt);
      return { shape: bm[0], scale: bm[1] || 1 };
    }

    function bakeIcon(id) {
      const m = /^adsb-([a-z0-9_]+)-([\d.]+)-([\d.]+)-([\d.]+)$/.exec(id);
      if (!m) return;
      const fill  = `hsl(${m[2]},${m[3]}%,${m[4]}%)`;
      const shape = (T90 && T90.shapes[m[1]]) || (m[1] === 'unknown' ? FALLBACK_SHAPE : null);
      if (!shape) return;
      let uri;
      if (T90) {
        uri = T90.svgShapeToURI(shape, fill, T90.outlineColor, T90.outlineWidth * 0.7 / ICON_BASE_SCALE, ICON_BASE_SCALE * ICON_PX_RATIO);
      } else {
        const w = shape.w * ICON_BASE_SCALE * ICON_PX_RATIO, h = shape.h * ICON_BASE_SCALE * ICON_PX_RATIO;
        uri = 'data:image/svg+xml;base64,' + btoa(
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${shape.viewBox}" width="${w}" height="${h}">` +
          `<path paint-order="stroke" fill="${fill}" stroke="#000" stroke-width="0.6" d="${shape.path}"/></svg>`
        );
      }
      const img = new Image();
      img.onload = () => {
        try {
          if (!map.hasImage(id)) {
            map.addImage(id, img, { pixelRatio: ICON_PX_RATIO });
            if (!_iconRepushTimer)
              _iconRepushTimer = setTimeout(() => { _iconRepushTimer = null; pushAircraft(); }, 120);
          }
        } catch {}
      };
      img.src = uri;
    }

    function ensureIcons(features) {
      for (const f of features) {
        const id = f.properties && f.properties.icon;
        if (id && !_adsbIcons.has(id)) { _adsbIcons.add(id); bakeIcon(id); }
      }
    }

    function buildAircraftFC() {
      const features = [];
      const now = Date.now();
      for (const hex of Object.keys(aircraftData)) {
        const ac = aircraftData[hex];
        if (!ac || ac.lat == null || ac.lon == null) continue;
        const bm  = baseMarker(ac);
        const hsl = altHsl(ac.alt_baro == null || ac.alt_baro === '' ? null : ac.alt_baro);
        const pos = _displayedCoords(hex, ac, now);
        features.push({
          type: 'Feature', id: hex,
          geometry: { type: 'Point', coordinates: [pos[1], pos[0]] },
          properties: {
            hex,
            icon:     iconId(bm.shape, hsl),
            scale:    bm.scale,
            track:    (typeof ac.track === 'number' && !isNaN(ac.track)) ? ac.track : 0,
            sort_key: -(typeof ac.alt_baro === 'number' ? ac.alt_baro : 0),
          },
        });
      }
      return { type: 'FeatureCollection', features };
    }

    function pushAircraft() {
      const src = map.getSource(ADSB_SRC);
      if (!src) return;
      const fc = buildAircraftFC();
      ensureIcons(fc.features);
      try { src.setData(fc); } catch {}
    }

    async function refreshAdsb() {
      if (adsbLat == null || adsbLon == null) return;
      try {
        const res = await fetch(`/proxy/adsb?lat=${adsbLat}&lon=${adsbLon}&dist=250`);
        const d   = await res.json();
        if (!d.ok) return;
        const active = new Set();
        const nowMs = Date.now();
        for (const ac of d.aircraft || []) {
          if (!ac.hex || ac.lat == null || ac.lon == null) continue;
          active.add(ac.hex);
          aircraftData[ac.hex] = ac;
          _updateAnimState(ac.hex, ac, nowMs);
        }
        for (const hex of Object.keys(aircraftData)) {
          if (!active.has(hex)) { delete aircraftData[hex]; delete animStates[hex]; }
        }
        pushAircraft();
        startAnimLoop();
      } catch (e) {
        console.warn('[adsb]', e);
      }
    }

    // ── WATCHTOWER STATUS POLL ────────────────────────────────────────────
    function showStateBanner(name) {
      const el = document.getElementById('state-banner');
      document.getElementById('state-banner-name').textContent = name.toUpperCase();
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 9000);
    }

    function render(d) {
      // Weather
      if (d.weather_temp_f !== null) {
        document.getElementById('wx-temp').textContent = d.weather_temp_f + '°F';
        document.getElementById('wx-desc').textContent = d.weather_desc || '---';
        document.getElementById('wx-icon').src =
          'https://openweathermap.org/img/wn/' + (d.weather_icon || '01d') + '@2x.png';
      }

      // Location
      document.getElementById('loc-val').textContent = (d.city_state || '---').toUpperCase();

      // Highway badge
      const hwBadge = document.getElementById('highway-badge');
      if (d.highway) {
        hwBadge.textContent = d.highway;
        hwBadge.className   = d.highway.startsWith('I-') ? 'hw-interstate' : 'hw-us';
        hwBadge.style.display = 'inline-block';
      } else {
        hwBadge.style.display = 'none';
      }

      // Stale badge
      document.getElementById('stale-badge').classList.toggle('show', !!d.stale);

      // State crossing
      const sc = d.state_crossing;
      if (sc && sc.at && sc.at !== lastCrossingAt && (Date.now() / 1000 - sc.at) < 15) {
        lastCrossingAt = sc.at;
        showStateBanner(sc.name);
      }

      // Map + ADS-B
      if (d.lat && d.lon && map) {
        adsbLat = d.lat;
        adsbLon = d.lon;

        // Kick off first ADS-B poll as soon as we have GPS + map loaded
        if (!adsbReady && map.loaded()) {
          adsbReady = true;
          refreshAdsb();
        }

        if (d.lat !== lastLat || d.lon !== lastLon) {
          posMarker.setLngLat([d.lon, d.lat]);
          map.easeTo({ center: [d.lon, d.lat], duration: 1000 });
          lastLat = d.lat; lastLon = d.lon;
        }

        const pt = [d.lon, d.lat];
        if (!lastPt || pt[0] !== lastPt[0] || pt[1] !== lastPt[1]) {
          liveCoords.push(pt);
          lastPt = pt;
          const src = map.getSource(ROUTE_SRC);
          if (src) src.setData({
            type: 'Feature',
            geometry: { type: 'LineString', coordinates: [...fullRoute, ...liveCoords] },
          });
        }
      }
    }

    async function loadRoute() {
      try {
        const res = await fetch('/api/route');
        if (!res.ok) return;
        const d = await res.json();
        fullRoute = (d.route || []).map(([lat, lon]) => [lon, lat]);
        if (fullRoute.length) {
          lastPt = fullRoute[fullRoute.length - 1];
          const src = map.getSource(ROUTE_SRC);
          if (src) src.setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: fullRoute } });
        }
      } catch (e) {
        console.warn('[route]', e);
      }
    }

    async function poll() {
      try {
        const r = await fetch('/api/status');
        if (r.ok) render(await r.json());
      } catch {
        document.getElementById('stale-badge').classList.add('show');
      }
      setTimeout(poll, 5000);
    }

    poll();

    // ── TIPS ──────────────────────────────────────────────────────────────
    (async function initTips() {
      let tips = [];
      try { const r = await fetch('/api/tips'); if (r.ok) tips = await r.json(); } catch {}
      if (!tips.length) return;
      for (let i = tips.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [tips[i], tips[j]] = [tips[j], tips[i]];
      }
      let idx = 0;
      const el = document.getElementById('tips-text');
      el.textContent = tips[0];
      setInterval(() => {
        el.style.opacity = '0';
        setTimeout(() => { idx = (idx + 1) % tips.length; el.textContent = tips[idx]; el.style.opacity = '1'; }, 700);
      }, 30000);
    })();
  </script>
</body>
</html>
